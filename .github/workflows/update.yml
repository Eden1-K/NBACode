name: Update NBA ladder

on:
  schedule:
    # US games finish ~05:30 UTC (about 4:30 pm Melbourne). Run after that,
    # then again later in case ESPN corrects a score.
    - cron: "23 7 * * *"
    - cron: "23 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ladder-update
  cancel-in-progress: false

defaults:
  run:
    working-directory: nba-ladder   # the project lives in this folder of the repo

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run model
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional - see README
        run: python run.py
      - name: Save results to the repo
        run: |
          git config user.name "ladder-bot"
          git config user.email "ladder-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Ladder update $(date -u +%Y-%m-%d)"
            git push
          fi
      # Website: needs Settings -> Pages -> Source = "GitHub Actions" (and a public repo or the
      # student plan). If Pages isn't on yet, these steps are skipped without failing the update.
      - name: Publish dashboard
        uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v4
        continue-on-error: true
        with:
          path: nba-ladder/docs
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
