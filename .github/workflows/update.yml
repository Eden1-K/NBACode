name: Update NBA ladder

on:
  schedule:
    # US games finish ~05:30 UTC (about 4:30 pm Melbourne). Run after that,
    # then again later in case ESPN corrects a score.
    - cron: "23 7 * * *"
    - cron: "23 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ladder-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run model
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional - see README
        run: python run.py
      - name: Commit results
        run: |
          git config user.name "ladder-bot"
          git config user.email "ladder-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Ladder update $(date -u +%Y-%m-%d)"
            git push
          fi
